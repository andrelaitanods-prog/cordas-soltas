/* Layout: trilha central serpenteando · menu lateral (desktop) ou inferior (celular) · lição em tela cheia */
:root {
  --c: #9b55e8; --k: #7836c2; --soft: #f5edff;           /* cor do instrumento (verniz), trocada por JS */
  --bg: #fff; --ink: #3a3550; --mute: #7d7791; --line: #e6e2ee; --line2: #d5d0e0; --wash: #f8f6fb;
  --ok: #43ad3c; --okk: #31892b; --oks: #dcf5d8; --warn: #f2a900; --warnk: #8f6200; --warns: #fff2cc; --bad: #e8484f; --badk: #b92f36; --bads: #ffe1e2;
  --f: 'Nunito', 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { font: 700 16px/1.45 var(--f); color: var(--ink); background: var(--bg); overflow-x: hidden; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 3px solid var(--c); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; text-wrap: balance; }
h1 { font-size: 28px; font-weight: 900; line-height: 1.15; }
h2 { font-size: 21px; font-weight: 900; line-height: 1.2; }
h3 { font-size: 17px; font-weight: 800; }
.mute { color: var(--mute); font-weight: 600; }

/* instrumentos */
.insts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.inst { border: 2px solid var(--line); border-radius: 16px; padding: 8px 4px 9px; display: flex; flex-direction: column; align-items: center; gap: 4px; box-shadow: 0 4px 0 var(--line); font-size: 14px; font-weight: 800; color: var(--mute); background: #fff; min-width: 0; }

.inst.on { border-color: var(--ic); background: var(--is); color: var(--ik); box-shadow: 0 4px 0 color-mix(in srgb, var(--ic) 55%, #fff); }

/* trilha */
.unit { background: var(--c); color: #fff; border-radius: 18px; box-shadow: 0 5px 0 var(--k); padding: 15px 18px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }

.path { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 18px 0 12px; position: relative; }
.node { position: relative; display: flex; flex-direction: column; align-items: center; gap: 9px; width: 190px; transform: translateX(var(--x)); }
.disc { width: 76px; height: 70px; border-radius: 50%; display: grid; place-items: center; font-size: 29px; font-weight: 900; background: #fff; color: var(--c); border: 3px solid color-mix(in srgb, var(--c) 32%, #fff); box-shadow: 0 7px 0 color-mix(in srgb, var(--c) 32%, #fff); }

.node .lbl { font-size: 15px; font-weight: 800; line-height: 1.2; text-align: center; margin-top: 5px; }
.go { position: absolute; top: -50px; background: #fff; border: 2px solid var(--line); border-radius: 11px; padding: 6px 13px; color: var(--c); font-weight: 900; font-size: 14px; letter-spacing: .05em; animation: bob 1.5s ease-in-out infinite; z-index: 2; }
.go::after { content: ''; position: absolute; left: 50%; bottom: -8px; width: 12px; height: 12px; background: #fff; border: solid var(--line); border-width: 0 2px 2px 0; transform: translateX(-50%) rotate(45deg); }

/* lição */

.x { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--mute); flex: none; }
.x:hover { background: var(--wash); }

.bar { flex: 1; height: 16px; border-radius: 9px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 9px; background: var(--c); position: relative; }

.chip { display: inline-flex; align-items: center; gap: 6px; font-weight: 900; font-size: 15px; color: var(--mute); white-space: nowrap; }
.body { flex: 1 0 auto; width: 100%; max-width: 1120px; margin: 0 auto; padding: 6px max(16px, env(safe-area-inset-right)) 18px max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 14px; justify-content: center; }
.ttl { display: flex; align-items: center; gap: 14px; }
.ttl .m { width: 70px; flex: none; }
.bubble { border: 2px solid var(--line); border-radius: 15px; padding: 10px 15px; font-weight: 700; position: relative; min-width: 0; }
.score { border: 2px solid var(--line); border-radius: 18px; overflow: hidden; background: #fff; position: relative; }
.score canvas { display: block; width: 100%; }
.count { position: absolute; inset: 0; display: grid; place-items: center; font-size: 110px; font-weight: 900; color: var(--c); pointer-events: none; -webkit-text-stroke: 8px #fff; paint-order: stroke fill; }
.live { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: stretch; }
.meter { border: 2px solid var(--line); border-radius: 18px; padding: 10px 18px 8px; display: grid; grid-template-columns: 88px minmax(0, 1fr); align-items: center; gap: 14px; }
.meter .nn { font-size: 38px; font-weight: 900; line-height: 1; text-align: center; }
.meter .cc { font-size: 14px; color: var(--mute); text-align: center; white-space: nowrap; }
.track { position: relative; height: 40px; }
.track .rail { position: absolute; left: 0; right: 0; top: 13px; height: 14px; border-radius: 8px; background: linear-gradient(90deg, var(--bads), var(--warns) 30%, var(--oks) 42%, var(--oks) 58%, var(--warns) 70%, var(--bads)); }
.track .mid { position: absolute; left: 50%; top: 6px; width: 4px; margin-left: -2px; height: 28px; border-radius: 2px; background: var(--ok); }
.track .ndl { position: absolute; left: 50%; top: 4px; width: 14px; height: 32px; margin-left: -7px; border-radius: 8px; background: var(--ink); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--ink); transition: left .07s linear; opacity: .18; }
.strs { border: 2px solid var(--line); border-radius: 18px; padding: 8px 16px; display: flex; gap: 14px; }
.str { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 14px; font-weight: 800; color: var(--mute); width: 34px; }
.str i { flex: 1; min-height: 34px; border-radius: 4px; background: var(--line2); }

.str.now b { background: var(--c); color: #fff; }
.str.now i { background: var(--c); }
.str.hit i { background: var(--ok); }
.opts { display: grid; gap: 14px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.modes { display: grid; gap: 12px; align-content: start; }
.mode { border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); border-radius: 16px; padding: 12px 15px; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; }
.mode svg { width: 40px; height: 40px; color: var(--line2); }
.mode b { display: block; font-weight: 900; line-height: 1.25; }
.mode span { font-size: 14px; color: var(--mute); font-weight: 600; line-height: 1.3; display: block; }
.mode.on { border-color: var(--c); background: var(--soft); box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 55%, #fff); }
.mode.on svg { color: var(--c); } .mode.on b { color: var(--k); }
.bpm { display: grid; grid-template-columns: 50px minmax(0, 1fr) 50px; gap: 12px; align-items: center; }
.bpm .btn { padding: 0; font-size: 24px; min-height: 46px; }
.bpm .v { text-align: center; line-height: 1.1; }
.bpm .v b { font-size: 34px; font-weight: 900; } .bpm .v span { font-size: 14px; color: var(--mute); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: none; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 12px; border-radius: 7px; background: var(--line); }
input[type=range]::-moz-range-track { height: 12px; border-radius: 7px; background: var(--line); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -8px; border-radius: 50%; background: var(--c); border: 4px solid #fff; box-shadow: 0 0 0 2px var(--c); }
input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--c); border: 4px solid #fff; box-shadow: 0 0 0 2px var(--c); }
.sw { display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; text-align: left; padding: 5px 0; min-height: 38px; }
.sw i { flex: none; width: 50px; height: 28px; border-radius: 15px; background: var(--line2); position: relative; transition: background .15s; }
.sw i::after { content: ''; position: absolute; left: 4px; top: 4px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; }
.sw[aria-checked=true] i { background: var(--c); } .sw[aria-checked=true] i::after { left: 26px; }
.sw small { display: block; font-size: 13.5px; font-weight: 600; color: var(--mute); line-height: 1.3; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 2px solid var(--line); border-radius: 14px; overflow: hidden; }
.seg button { padding: 10px 6px; font-weight: 800; color: var(--mute); border-left: 2px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--soft); color: var(--k); }
.note { border-radius: 13px; padding: 10px 14px; background: var(--warns); color: #6b4a00; font-size: 14.5px; line-height: 1.35; font-weight: 700; }
.drawer { border-top: 2px solid var(--line); padding: 15px max(16px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); flex: none; position: sticky; bottom: 0; background: var(--bg); z-index: 3; }

/* afinador */

.gauge canvas { width: 100%; max-width: 480px; }
.tstr { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }

/* modal */

.gl { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 8px 14px; align-items: center; }
.gl svg { height: 48px; width: 62px; }
.dots { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.dots i { width: 20px; height: 20px; border-radius: 50%; background: var(--line); }

.toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 14px; z-index: 60; font-size: 15px; max-width: calc(100% - 32px); text-align: center; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; } .row > .btn { flex: 1 1 190px; }
.drawer .row { flex-wrap: nowrap; } .drawer .row > .btn { flex: 0 1 auto; min-width: 150px; white-space: nowrap; }
.kv { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }

@media (max-width: 1120px) { #app { grid-template-columns: 232px minmax(0, 1fr); } aside { display: none; } }

  #nav .brand { display: none; }

  .inst { font-size: 12.5px; } .inst svg { height: 56px; }
  .opts { grid-template-columns: minmax(0, 1fr); }
  .body { justify-content: flex-start; }
  .ttl .m { width: 54px; }
  .live { grid-template-columns: minmax(0, 1fr); }
  .strs { justify-content: center; } .str i { min-height: 22px; }
  .meter { grid-template-columns: 74px minmax(0, 1fr); padding: 10px 14px 8px; }

  .res { grid-template-columns: 92px minmax(0, 1fr); gap: 14px; } .res .m { width: 92px; } .big svg { width: 44px; height: 44px; }

  ${fix ? `<div class="note" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><span style="flex:1 1 260px">Suas notas vieram sempre cerca de <b class="num">${Math.abs(ms(fix))} ms ${fix > 0 ? 'depois' : 'antes'}</b> do pulso, com regularidade. Se você sentiu que tocou junto, é o delay do aparelho.</span><button class="btn sm" id="fx">Corrigir delay</button></div>` : ''}
  <div class="score"><canvas id="rv" role="img" aria-label="Partitura com as notas certas e erradas"></canvas></div>
  <div class="legend"><span><i style="background:#43ad3c"></i>✓ certa</span><span><i style="background:#f2a900"></i>↑ grave, suba · ↓ aguda, desça · → adiantou · ← atrasou · – curta ou emendada</span><span><i style="background:#e8484f"></i>✕ não ouvi ou corda errada</span></div>`;
  const rv = () => $('#rv') && Score.rows($('#rv'), L, S.inst, { res }); rv(); window.onresize = rv;
  if (fix) $('#fx').onclick = e => { S.rtl[rtlKey()] = clamp(R.lat + fix, 0, .8); save(); e.target.disabled = true; e.target.textContent = 'Corrigido'; };
  $('#dr').className = 'drawer resd'; const faster = st === 3 && lessonBpm(L.n) < 120;
  $('#dr > div').innerHTML = again + `<div class="row">${faster ? `<button class="btn sec" id="fs">+6 bpm</button>` : `<button class="btn sec" id="op">Opções</button>`}${st && nextL ? `<button class="btn ok" id="nx">Próxima lição</button>` : `<button class="btn" id="hm">Trilha</button>`}</div>`;
  $('#ag').onclick = () => start(L); if ($('#fs')) $('#fs').onclick = () => { S.bpm[L.n] = lessonBpm(L.n) + 6; save(); start(L); }; if ($('#op')) $('#op').onclick = () => setupView(L);

function touch(xp) {

}

/* ---- afinador ---- */
function pgTuner() {
  const I = INST[S.inst], m = $('#main');
  m.innerHTML = `<div class="page"><h1>Afinador</h1><div class="card"><div class="gauge"><canvas id="tg" role="img" aria-label="Ponteiro do afinador"></canvas></div><button class="btn" id="tm">Ligar microfone</button></div><h3>Ouvir a referência</h3><div class="tstr">${I.strings.map(s => `<button class="btn sec" data-s="${s}">${NOTE_PT[s]}<small class="num">${hz(I.midi[s], S.a4).toFixed(1)} Hz</small></button>`).join('')}</div><div class="kv"><span class="mute">Lá de referência</span><div class="seg" style="width:230px">${[440, 441, 442].map(a => `<button data-a="${a}" class="num ${S.a4 === a ? 'on' : ''}">${a}</button>`).join('')}</div></div></div>`;
  $('.page', m).insertBefore(instPicker(() => go('tuner')), $('.card', m));
  let off, raf, an, st = { s: null, c: 0, at: 0, hist: [] };
  const draw = () => {
    const cv = $('#tg'); if (!cv) return; const w = Math.min(480, cv.parentElement.clientWidth), h = w * .62, d = Math.min(3, devicePixelRatio || 1);
    if (cv.width !== Math.round(w * d)) { cv.width = w * d; cv.height = h * d; cv.style.height = h + 'px'; cv.style.width = w + 'px'; } const g = cv.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, w, h);
    const cx = w / 2, cy = h * .88, r = h * .74, A = c => Math.PI * 1.5 + c / 50 * Math.PI * .36; g.lineCap = 'round'; g.lineWidth = 16;
    for (const [a, b, col] of [[-50, -22, '#ffd0d2'], [22, 50, '#ffd0d2'], [-20, -7, '#ffe9a8'], [7, 20, '#ffe9a8'], [-4, 4, '#43ad3c']]) { g.strokeStyle = col; g.beginPath(); g.arc(cx, cy, r, A(a), A(b)); g.stroke(); }
    const on = st.s && performance.now() - st.at < 500, c = clamp(st.c, -50, 50), good = on && Math.abs(c) <= 5;
    g.strokeStyle = on ? '#3a3550' : '#d5d0e0'; g.lineWidth = 6; g.beginPath(); g.moveTo(cx + Math.cos(A(c)) * r * .55, cy + Math.sin(A(c)) * r * .55); g.lineTo(cx + Math.cos(A(c)) * (r - 4), cy + Math.sin(A(c)) * (r - 4)); g.stroke();
    g.textAlign = 'center'; g.fillStyle = good ? '#31892b' : on ? '#3a3550' : '#a8a2b8'; g.font = `900 ${w * .145}px Nunito`; g.fillText(on ? NOTE_PT[st.s] : '–', cx, cy - h * .12);
    g.font = `800 ${Math.max(15, w * .037)}px Nunito`; g.fillText(on ? (good ? 'Afinada' : `${sgn(Math.round(st.c))} cents · ${st.c < 0 ? 'suba' : 'desça'}`) : off ? 'Toque uma corda solta' : 'Microfone desligado', cx, cy + h * .02);
    $$('.tstr .btn').forEach(b => b.classList.toggle('on', on && b.dataset.s === st.s));
    raf = off ? requestAnimationFrame(draw) : 0;
  };
  draw(); document.fonts && document.fonts.ready.then(() => page === 'tuner' && !off && draw());
  const onr = () => !off && draw(); addEventListener('resize', onr);
  $('#tm').onclick = async () => {
    if (off) { off(); off = null; $('#tm').textContent = 'Ligar microfone'; return; }
    try { await AE.ensureMic(); } catch (e) { return micError(e); } if (page !== 'tuner') return;
    an = new DSP.Analyzer(AE.ctx.sampleRate, S.inst); $('#tm').textContent = 'Desligar microfone';
    off = AE.onMic((b, t) => { for (const p of an.push(b, t).pitch) if (p.f && p.c > .75) {
      let best = null; for (const s of I.strings) { const c = 1200 * Math.log2(p.f / hz(I.midi[s], S.a4)); if (!best || Math.abs(c) < Math.abs(best.c)) best = { s, c }; }
      if (Math.abs(best.c) > 320) continue; if (st.s !== best.s) st.hist = []; st.hist.push(best.c); if (st.hist.length > 9) st.hist.shift(); st.s = best.s; st.c = DSP.median(st.hist); st.at = performance.now(); } }); cancelAnimationFrame(raf); draw();
  };
  $$('.tstr .btn').forEach(b => b.onclick = async () => { await AE.ensureCtx(); AE.stopAll(); AE.ref(S.inst, I.midi[b.dataset.s], S.a4); });
  $$('.seg [data-a]').forEach(b => b.onclick = () => { S.a4 = +b.dataset.a; save(); go('tuner'); });
  cleanup = () => { off && off(); off = null; cancelAnimationFrame(raf); removeEventListener('resize', onr); AE.ctx && AE.stopAll(); };
}

/* ---- ajustes ---- */
function pgSet() {
  const m = $('#main'), cal = S.rtl[rtlKey()];
  m.innerHTML = `<div class="page"><h1>Ajustes</h1>
  <div class="card"><h2>Delay</h2><p class="mute small">O som leva um tempo para sair do alto-falante e outro para entrar pelo microfone. O app desconta esse tempo antes de julgar o seu ritmo.</p>${swt('sph', S.phones, 'Estou de fones', 'Cada saída guarda a sua própria calibração')}
    <div class="kv"><span>Ida e volta do som</span><b class="num" id="rv">${cal == null ? 'estimado' : ms(cal) + ' ms'}</b></div><input type="range" id="rr" min="0" max="500" step="1" value="${cal == null ? 80 : ms(cal)}" aria-label="Delay de ida e volta em milissegundos">
    <button class="btn" id="cal">Calibrar</button></div>
  <div class="card"><h2>Sincronia da imagem</h2><p class="mute small">Ligue o teste. A bola deve acender exatamente quando você ouve o clique. Se a imagem vier antes do som, aumente.</p><div class="dots" style="padding:6px 0"><i id="vb" style="width:54px;height:54px"></i></div><div class="kv"><span>Ajuste da imagem</span><b class="num" id="vv">${sgn(-ms(S.vis))} ms</b></div><input type="range" id="vr" min="-250" max="250" step="5" value="${-ms(S.vis)}" aria-label="Ajuste da imagem em milissegundos"><button class="btn sec" id="vt">Ligar teste</button></div>
  <div class="card"><h2>Exigência</h2><div class="seg">${[['easy', 'Iniciante'], ['normal', 'Normal'], ['hard', 'Exigente']].map(a => `<button data-l="${a[0]}" class="${S.level === a[0] ? 'on' : ''}">${a[1]}</button>`).join('')}</div><p class="mute small num" id="lt"></p></div>
  <div class="card"><h2>Volume</h2><div class="kv"><label for="v1">Instrumento gravado</label></div><input type="range" id="v1" min="0" max="1" step=".05" value="${S.vNote}"><div class="kv"><label for="v2">Pulso</label></div><input type="range" id="v2" min="0" max="1" step=".05" value="${S.vClick}"></div>
  <div class="card"><h2>Recomeçar</h2><p class="mute small">Apaga estrelas, pontos e a sequência de dias. A calibração fica.</p><button class="btn sec" id="wipe">Apagar progresso</button></div>
  <p class="mute small">Sons: FluidR3 / MuseScore General (MIT). Notação: Bravura (OFL). Letra: Nunito (OFL).</p></div>`;
  bindSw('sph', () => S.phones, v => { S.phones = v; save(); go('set'); });
  $('#rr').oninput = e => { S.rtl[rtlKey()] = e.target.value / 1000; $('#rv').textContent = e.target.value + ' ms'; save(); }; $('#cal').onclick = () => calModal(() => go('set'));
  const lt = () => { const q = DSP.LEVELS[S.level]; $('#lt').textContent = `Aceita até ${q.cents} cents de afinação e ${q.ms} ms de ritmo.`; }; lt();
  $$('[data-l]').forEach(b => b.onclick = () => { S.level = b.dataset.l; save(); $$('[data-l]').forEach(x => x.classList.toggle('on', x === b)); lt(); });
  $('#v1').oninput = e => { S.vNote = +e.target.value; save(); }; $('#v2').oninput = e => { S.vClick = +e.target.value; save(); };
  $('#vr').oninput = e => { S.vis = -e.target.value / 1000; $('#vv').textContent = sgn(+e.target.value) + ' ms'; save(); };
  $('#wipe').onclick = () => { const d = modal('<h2>Apagar o progresso?</h2><p class="mute">Estrelas e pontos dos quatro instrumentos serão apagados.</p><div class="row"><button class="btn sec" data-x>Cancelar</button><button class="btn" id="wy">Apagar</button></div>'); $('#wy').onclick = () => { S.prog = {}; S.xp = 0; S.streak = 0; S.last = ''; save(); d.close(); go('set'); toast('Progresso apagado'); }; };
  let raf = 0, on = false;
  $('#vt').onclick = async () => {
    if (on) { on = false; cancelAnimationFrame(raf); AE.stopAll(); $('#vt').textContent = 'Ligar teste'; $('#vb').style.background = ''; return; }
    await AE.ensureCtx(); if (!$('#vt')) return; on = true; $('#vt').textContent = 'Desligar teste'; const t0 = AE.ctx.currentTime + .3, sp = .75; let k = 0;
    const f = () => { if (!on || !$('#vb')) return; while (t0 + k * sp < AE.ctx.currentTime + 1) { AE.click(t0 + k * sp, k % 4 === 0, .8); k++; } const b = (AE.heard() + S.vis + .008 - t0) / sp, fr = b - Math.floor(b); $('#vb').style.background = b > 0 && fr < .16 ? INST[S.inst].c : ''; raf = requestAnimationFrame(f); }; f();
  };

}

/* ---- calibração ---- */
function calModal(after) {
  if (typeof after !== 'function') after = () => go(page);
  let dead = false, undo = null; const M = modal('<div id="cb" style="display:flex;flex-direction:column;gap:16px"></div>', { close: () => { dead = true; undo && undo(); AE.ctx && AE.stopAll(); after(); } }), cb = $('#cb', M.el);
  const home = () => { cb.innerHTML = `<div class="m">${crico('happy')}</div><h2 style="text-align:center">Calibrar o delay</h2>
    <button class="mode ${S.phones ? '' : 'on'}" id="ca">${ICON.metro}<div><b>Pelo alto-falante</b><span>O app toca 8 bipes e ouve a si mesmo. O mais preciso. Volume médio, sala quieta.</span></div></button>
    <button class="mode ${S.phones ? 'on' : ''}" id="cp">${ICON.ear}<div><b>De fones, tocando junto</b><span>Toque a corda Ré em semínimas junto com o pulso. Serve para qualquer fone.</span></div></button>
    <p class="note">Fone Bluetooth atrasa muito e varia. Prefira fone com fio ou o alto-falante.</p><button class="btn sec" data-c>Agora não</button>`; $('[data-c]', cb).onclick = M.close; $('#ca').onclick = () => { S.phones = false; save(); auto(); }; $('#cp').onclick = () => { S.phones = true; save(); play(); }; };
  const fail = (t, retry) => { cb.innerHTML = `<div class="m">${crico('sad')}</div><h2 style="text-align:center">Não deu certo</h2><p class="mute">${t}</p><div class="row"><button class="btn sec" id="ch">Voltar</button><button class="btn" id="cr">Tentar de novo</button></div>`; $('#ch').onclick = home; $('#cr').onclick = retry; };
  const done = (v, extra) => { S.rtl[rtlKey()] = v; save(); cb.innerHTML = `<div class="m">${crico('wow')}</div><h2 style="text-align:center">Pronto: <span class="num">${ms(v)} ms</span></h2><p class="mute" style="text-align:center">${extra}</p><button class="btn" id="cd">Continuar</button>`; $('#cd').onclick = M.close; };
  const auto = async () => {
    cb.innerHTML = `<div class="m">${crico('play')}</div><h2 style="text-align:center">Ouvindo os bipes…</h2><p class="mute" style="text-align:center">Fique em silêncio por alguns segundos.</p><div class="dots">${'<i></i>'.repeat(8)}</div>`;
    let r; try { r = await AE.autoCal(k => $$('.dots i', cb).forEach((d, i) => d.classList.toggle('hit', i < k))); } catch (e) { if (dead) return; M.close(); return micError(e); } if (dead) return;
    if (r.ok) done(r.rtl, `${r.n} medições, com variação de ${Math.max(1, ms(r.spread))} ms.`); else fail(r.why === 'mudo' ? 'O microfone não captou som nenhum. Confira qual microfone está selecionado no sistema.' : r.why === 'fraco' ? 'Os bipes chegaram fracos. Aumente o volume, tire os fones e tente de novo.' : 'As medidas variaram demais. Feche outros programas de áudio e evite Bluetooth.', auto);
  };
  const play = async () => {
    try { await AE.ensureMic(); } catch (e) { M.close(); return micError(e); } if (dead) return;
    const N = 16, spb = .75, hits = []; cb.innerHTML = `<div class="m">${crico('play')}</div><h2 style="text-align:center" id="ch2">Escute 4 pulsos…</h2><p class="mute" style="text-align:center">Depois toque a corda Ré, uma nota curta em cada pulso, trocando o arco.</p><div class="dots">${'<i></i>'.repeat(N)}</div><button class="btn sec" id="cc2">Cancelar</button>`; $('#cc2').onclick = M.close;
    const t0 = AE.ctx.currentTime + .4; for (let k = 0; k < N + 4; k++) AE.click(t0 + k * spb, k % 4 === 0, .8);
    const T = t0 + 4 * spb, an = new DSP.Analyzer(AE.ctx.sampleRate, S.inst), pit = []; let pend = [];
    const off = AE.onMic((b, t) => { const ev = an.push(b, t); pit.push(...ev.pitch); pend.push(...ev.onsets); pend = pend.filter(o => { if (t < o.t + .2) return true; if (pit.some(p => p.t > o.t && p.t < o.t + .2 && p.f && p.c > .7)) { const k = Math.round((o.t - .13 - T) / spb), e = o.t - T - k * spb; if (k >= 0 && k < N && !hits[k] && e > -.12 && e < .5) { hits[k] = { e }; const d = $$('.dots i', cb)[k]; d && d.classList.add('hit'); } } return false; }); });
    let raf; const f = () => { if (dead) return; const b = Math.floor((AE.heard() + S.vis - T) / spb); if (b >= 0 && $('#ch2')) $('#ch2').textContent = 'Toque junto!'; $$('.dots i', cb).forEach((d, i) => d.classList.toggle('beat', i === b)); raf = requestAnimationFrame(f); }; f();
    undo = () => { off(); cancelAnimationFrame(raf); };
    await new Promise(r => setTimeout(r, (.4 + (N + 4) * spb + .7) * 1000)); undo(); if (dead) return;
    const e = hits.filter(Boolean).map(h => h.e).slice(2), med = DSP.median(e), mad = DSP.median(e.map(v => Math.abs(v - med)));
    if (e.length < 7) return fail('Ouvi poucas notas. Toque mais perto do microfone, com ataques claros.', play); if (mad > .05) return fail('As notas variaram muito em relação ao pulso. Respire, espere entrar no tempo e tente outra vez.', play);
    done(clamp(med, 0, .6), `${e.length} notas, com variação de ${Math.max(1, ms(mad))} ms.`);
  };
  home();
}

/* ---- início ---- */
function welcome() {
  const M = modal(`<div class="m">${crico('happy')}</div><h2 style="text-align:center">Oi, eu sou o Crico!</h2><p class="mute" style="text-align:center">São 12 lições com as cordas Ré e Lá. Qual é o seu instrumento?</p><div id="wi"></div><button class="btn" id="wg">Continuar</button>`, { lock: true });
  $('#wi').append(instPicker(() => { $('.m', M.el).innerHTML = crico('happy'); })); $('#wg').onclick = () => { S.first = false; save(); M.close(); go('path'); calModal(); };
}
shell(); theme(); go('path'); if (S.first) welcome();
if (document.fonts) document.fonts.load('800 16px Nunito').then(() => { });
addEventListener('keydown', e => { if ($('#lesson').hidden || $('.ov')) return; if (e.key === 'Escape') { e.preventDefault(); run ? setupView(run.L) : closeLesson(); } else if (e.key === ' ' && !/^(INPUT|BUTTON)$/.test(document.activeElement.tagName)) { e.preventDefault(); const b = $('#stop') || $('#start') || $('#ag'); b && b.click(); } });

/* O celular dispara devicechange ao conceder o microfone: só reage se a lista de aparelhos mudou de verdade */
let devs = null;
const devList = async () => { try { return (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind.startsWith('audio')).map(d => d.kind + d.deviceId + d.groupId).sort().join('|'); } catch (e) { return null; } };
AE.onOpen = () => { devs = null; setTimeout(async () => { devs = await devList(); }, 2000); };
if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) navigator.mediaDevices.addEventListener('devicechange', async () => {
  if (!AE.ctx || devs === null) return; const now = await devList(); if (now === null || devs === null || now === devs) return;
  const L = run && run.L; if (L) setupView(L); AE.dropMic(); devs = null; toast('O dispositivo de áudio mudou. Confira os fones e calibre de novo.');
});
window.__cs = { S, get run() { return run; }, AE, DSP, start, LESSONS };
