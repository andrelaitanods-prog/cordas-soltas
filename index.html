/* Layout: trilha central serpenteando · menu lateral (desktop) ou inferior (celular) · lição em tela cheia */
:root {
  --c: #9b55e8; --k: #7836c2; --soft: #f5edff;           /* cor do instrumento (verniz), trocada por JS */
  --bg: #fff; --ink: #3a3550; --mute: #7d7791; --line: #e6e2ee; --line2: #d5d0e0; --wash: #f8f6fb;
  --ok: #43ad3c; --okk: #31892b; --oks: #dcf5d8; --warn: #f2a900; --warnk: #8f6200; --warns: #fff2cc; --bad: #e8484f; --badk: #b92f36; --bads: #ffe1e2;
  --f: 'Nunito', 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { font: 700 16px/1.45 var(--f); color: var(--ink); background: var(--bg); overflow-x: hidden; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 3px solid var(--c); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; text-wrap: balance; }
h1 { font-size: 28px; font-weight: 900; line-height: 1.15; }
h2 { font-size: 21px; font-weight: 900; line-height: 1.2; }
h3 { font-size: 17px; font-weight: 800; }
.mute { color: var(--mute); font-weight: 600; }

    await new Promise(r => setTimeout(r, (.4 + (N + 4) * spb + .7) * 1000)); undo(); if (dead) return;
    const e = hits.filter(Boolean).map(h => h.e).slice(2), med = DSP.median(e), mad = DSP.median(e.map(v => Math.abs(v - med)));
    if (e.length < 7) return fail('Ouvi poucas notas. Toque mais perto do microfone, com ataques claros.', play); if (mad > .05) return fail('As notas variaram muito em relação ao pulso. Respire, espere entrar no tempo e tente outra vez.', play);
    done(clamp(med, 0, .6), `${e.length} notas, com variação de ${Math.max(1, ms(mad))} ms.`);
  };
  home();
}
